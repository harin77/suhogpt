# Builds SuhoGPT for Windows and Linux.
#  - Push a tag like v1.0.0  -> builds both and publishes a GitHub Release with the downloads.
#  - Actions tab -> "Build SuhoGPT" -> Run workflow  -> builds only (zips under the run's Artifacts).
name: Build SuhoGPT

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: suho_app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force SuhoGPT-windows-x64 | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* SuhoGPT-windows-x64/
          New-Item -ItemType Directory -Force SuhoGPT-windows-x64/models | Out-Null
          Set-Content SuhoGPT-windows-x64/models/PUT_MODEL_HERE.txt "Put the Suho .gguf model file in this folder, then run suho_ai.exe"
          Compress-Archive -Path SuhoGPT-windows-x64 -DestinationPath ../SuhoGPT-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SuhoGPT-windows-x64
          path: SuhoGPT-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04 # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          mkdir -p SuhoGPT-linux-x64/models
          cp -r build/linux/x64/release/bundle SuhoGPT-linux-x64/bundle
          cp packaging/install_linux.sh SuhoGPT-linux-x64/
          cp -r assets/icon SuhoGPT-linux-x64/icons
          echo "Put the Suho .gguf model file here (or pass it to install_linux.sh)" > SuhoGPT-linux-x64/models/PUT_MODEL_HERE.txt
          tar -czf ../SuhoGPT-linux-x64.tar.gz SuhoGPT-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SuhoGPT-linux-x64
          path: SuhoGPT-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: SuhoGPT ${{ github.ref_name }}
          files: |
            SuhoGPT-windows-x64.zip
            SuhoGPT-linux-x64.tar.gz
          body: |
            ## SuhoGPT ${{ github.ref_name }}
            Offline Tanglish / English assistant for Linux, coding and cybersecurity, running on llama.cpp.

            ### Downloads
            | OS | File |
            |---|---|
            | Windows 10/11 (x64) | `SuhoGPT-windows-x64.zip` – unzip, put the model `.gguf` in `models\`, run `suho_ai.exe` |
            | Linux (any distro, x64) | `SuhoGPT-linux-x64.tar.gz` – extract, run `./install_linux.sh path/to/model.gguf` |

            ### Model
            Download `Qwen2.5-3B-Instruct.Q4_K_M.gguf` (1.9 GB) from this release's assets if attached.

            On first start, the app checks your CPU, RAM and GPU, downloads llama.cpp (~40 MB, Vulkan GPU build with CPU fallback) and picks the best settings. Works on 8 GB RAM PCs (Low-RAM mode).
